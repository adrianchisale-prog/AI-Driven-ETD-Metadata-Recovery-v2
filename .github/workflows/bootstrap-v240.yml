name: Bootstrap v2.4.0 source

on:
  push:
    paths:
      - '.bootstrap_v240/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct clean source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap_v240/part* | base64 --decode > /tmp/etd-v240.tar.gz
          tar -xzf /tmp/etd-v240.tar.gz -C .
          rm -rf .bootstrap .bootstrap_v240
          rm -f .github/workflows/bootstrap-v240.yml
          python -m compileall -q backend/app
      - name: Commit clean v2.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Build v2.4.0 institutional ETD harvest demo'
          git push origin HEAD:main
